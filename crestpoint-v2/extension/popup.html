<!DOCTYPE html>
<html>
  <body style="width: 320px; font-family: Arial; padding: 14px;">
    <h2>Crestpoint Job Importer</h2>

    <input id="userId" placeholder="Supabase User ID" style="width:100%; margin-bottom:8px;" />
    <input id="company" placeholder="Company" style="width:100%; margin-bottom:8px;" />
    <input id="role" placeholder="Role" style="width:100%; margin-bottom:8px;" />

    <textarea id="description" placeholder="Job description" style="width:100%; height:100px; margin-bottom:8px;"></textarea>

    <button id="save" style="width:100%;">Save Job</button>

    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
