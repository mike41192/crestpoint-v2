<!DOCTYPE html>
<html>
  <body style="width: 340px; font-family: Arial; padding: 14px;">
    <h2>Crestpoint Job Importer</h2>

    <p style="font-size: 12px; color: #555;">
      Enter your Supabase User ID once. The floating “Save to Crestpoint”
      button will use it automatically.
    </p>

    <input
      id="userId"
      placeholder="Supabase User ID"
      style="width:100%; margin-bottom:8px; padding:8px;"
    />

    <button id="saveUser" style="width:100%; padding:10px;">
      Save User ID
    </button>

    <hr />

    <input
      id="company"
      placeholder="Company"
      style="width:100%; margin-bottom:8px; padding:8px;"
    />

    <input
      id="role"
      placeholder="Role"
      style="width:100%; margin-bottom:8px; padding:8px;"
    />

    <textarea
      id="description"
      placeholder="Job description"
      style="width:100%; height:100px; margin-bottom:8px; padding:8px;"
    ></textarea>

    <button id="save" style="width:100%; padding:10px;">
      Manual Save Job
    </button>

    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
